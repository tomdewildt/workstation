---
browser:
  default: brave-browser

claude:
  marketplaces:
    claude-plugins-official: anthropics/claude-plugins-official
    ponytail: DietrichGebert/ponytail
  plugins:
    - gopls-lsp@claude-plugins-official
    - ponytail@ponytail
    - pyright-lsp@claude-plugins-official
    - rust-analyzer-lsp@claude-plugins-official
    - typescript-lsp@claude-plugins-official

config:
  repository: https://github.com/tomdewildt/config.git
  timezone: Europe/Amsterdam

codex:
  marketplaces:
    ponytail: DietrichGebert/ponytail
  plugins:
    - ponytail@ponytail

code:
  extensions:
    # Ansible
    - redhat.ansible
    # Docker
    - ms-azuretools.vscode-docker
    # Dotenv
    - mikestead.dotenv
    # General
    - arcticicestudio.nord-visual-studio-code
    - mechatroner.rainbow-csv
    - ms-vsliveshare.vsliveshare
    # Golang
    - golang.go
    # HCL
    - hashicorp.hcl
    # Javascript
    - dbaeumer.vscode-eslint
    - esbenp.prettier-vscode
    - oxc.oxc-vscode
    - vitest.explorer
    # Jupyter
    - ms-toolsai.jupyter
    # Markdown
    - yzhang.markdown-all-in-one
    # PDF
    - tomoki1207.pdf
    # Python
    - charliermarsh.ruff
    - ms-python.python
    - ms-python.vscode-pylance
    - teticio.python-envy
    # Rust
    - rust-lang.rust-analyzer
    # Spellcheck
    - streetsidesoftware.code-spell-checker
    - streetsidesoftware.code-spell-checker-dutch
    # Terraform
    - hashicorp.terraform
    # TOML
    - tamasfe.even-better-toml
    # YAML
    - redhat.vscode-yaml

golang:
  version: 1.21.4

node:
  version: 24.x
  packages:
    - cdktf-cli
    - gatsby-cli

python:
  version: 3.11.14
  packages:
    - ansible-lint
    - ruff
    - pre-commit
    - pyright
    - virtualenv

rust:
  components:
    - rustfmt
    - clippy
    - rust-analyzer
    - rust-src

vagrant:
  version: 2.4.0
