---
- name: Install chatgpt (linux)
  become: true
  when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'
  block:
    - name: Read browser desktop file (linux)
      ansible.builtin.slurp:
        src: /usr/share/applications/{{ browser.default }}.desktop
      register: browser_file

    - name: Extract browser executable (linux)
      ansible.builtin.set_fact:
        browser_executable: "{{ browser_file.content | b64decode | regex_search('^Exec=([^ ]*).*', '\\1', multiline=True) | first }}"

    - name: Ensure icons folder exists (linux)
      ansible.builtin.file:
        path: /usr/share/applications/icons
        state: directory
        mode: "0755"

    - name: Download chatgpt icon (linux)
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/refs/heads/main/png/chatgpt.png
        dest: /usr/share/applications/icons/chatgpt.png
        owner: root
        group: root
        mode: "0644"

    - name: Copy chatgpt desktop file (linux)
      ansible.builtin.template:
        src: templates/chatgpt/chatgpt.desktop.j2
        dest: /usr/share/applications/chatgpt.desktop
        owner: root
        group: root
        mode: "0644"

- name: Install chatgpt (macos)
  community.general.homebrew_cask:
    name: chatgpt
    install_options: appdir=/Applications
    state: latest
  when: ansible_distribution == 'MacOSX'
