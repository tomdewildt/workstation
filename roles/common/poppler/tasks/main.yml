---
- name: Install poppler (linux)
  become: true
  ansible.builtin.apt:
    name: poppler-utils
    state: latest
  when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'

- name: Install poppler (macos)
  community.general.homebrew:
    name: poppler
    state: latest
  when: ansible_distribution == 'MacOSX'
